name: 问题反馈 / Bug report
description: 报告一个可以稳定复现的插件、Skill、脚本或文档问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请移除用户名、账号、设备标识、调试地址、Cookie、令牌和真实评论原文。
  - type: dropdown
    id: area
    attributes:
      label: 涉及能力
      options:
        - AppGallery 评论采集
        - AppGallery 版本采集
        - 小红书舆情
        - 评论标签化
        - 满意度分析
        - 报告生成
        - Android/HarmonyOS 功能盘点
        - 安装或文档
        - 其他
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 你原本想完成什么
      placeholder: 请描述目标平台、时间范围和期望输出。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 请按顺序列出命令、提示词或操作步骤。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与停止位置
      placeholder: 可以粘贴已脱敏的错误片段。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: Windows 版本、Python、HDC/Hypium、插件版本等
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交检查
      options:
        - label: 我已移除个人信息、设备标识、连接地址和凭据
          required: true
