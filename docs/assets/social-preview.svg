<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">鸿蒙应用解决方案助手</title>
  <desc id="desc">HarmonyOS Mobile App Research, an evidence-to-decision agent workflow for Codex and ChatGPT.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1324"/>
      <stop offset="1" stop-color="#102B3D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#49A9E8"/>
      <stop offset="1" stop-color="#48D6B2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020712" flood-opacity="0.34"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="1140" cy="-20" r="260" fill="#49A9E8" fill-opacity="0.08"/>
  <circle cx="70" cy="640" r="230" fill="#48D6B2" fill-opacity="0.06"/>

  <g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif">
    <rect x="72" y="64" width="306" height="40" rx="20" fill="#153A52" stroke="#3E7999"/>
    <text x="225" y="90" text-anchor="middle" fill="#B9E7FF" font-size="17" font-weight="700" letter-spacing="1.4">CODEX PLUGIN · 7 SKILLS</text>

    <text x="72" y="181" fill="#FFFFFF" font-size="54" font-weight="800">鸿蒙应用解决方案助手</text>
    <text x="72" y="235" fill="#B9C9D6" font-size="30" font-weight="600">HarmonyOS Mobile App Research</text>
    <rect x="72" y="270" width="610" height="4" rx="2" fill="url(#accent)"/>

    <text x="72" y="325" fill="#E2EDF3" font-size="25" font-weight="600">让 Codex / ChatGPT 成为你的鸿蒙产品研究 Agent</text>
    <text x="72" y="367" fill="#9FB4C2" font-size="20">真机与市场证据 · 结构化分析 · 功能验证 · 可交付报告</text>

    <g transform="translate(72 420)">
      <rect width="178" height="58" rx="12" fill="#142E43" stroke="#2D6B8E"/>
      <text x="89" y="37" text-anchor="middle" fill="#C9EBFF" font-size="20" font-weight="700">AppGallery 证据</text>
      <rect x="194" width="170" height="58" rx="12" fill="#143B38" stroke="#278878"/>
      <text x="279" y="37" text-anchor="middle" fill="#C8F5E9" font-size="20" font-weight="700">满意度分析</text>
      <rect x="380" width="192" height="58" rx="12" fill="#302D48" stroke="#69629C"/>
      <text x="476" y="37" text-anchor="middle" fill="#E3DFFF" font-size="20" font-weight="700">功能差异矩阵</text>
    </g>

    <text x="72" y="555" fill="#8FA6B5" font-size="18">一句话启动 · 按 Skill 拆装 · 从证据走到行动</text>

    <g transform="translate(765 73)" filter="url(#shadow)">
      <rect width="438" height="494" rx="26" fill="#FFFFFF" fill-opacity="0.97"/>
      <text x="40" y="55" fill="#183247" font-size="18" font-weight="700" letter-spacing="1.1">EVIDENCE → INSIGHT → DECISION</text>

      <g transform="translate(38 88)">
        <rect width="362" height="92" rx="16" fill="#EAF6FD" stroke="#49A9E8" stroke-width="2"/>
        <circle cx="48" cy="46" r="24" fill="#318BC4"/>
        <text x="48" y="53" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800">1</text>
        <text x="88" y="39" fill="#17374C" font-size="22" font-weight="800">真机与公开证据</text>
        <text x="88" y="67" fill="#557081" font-size="16">评论 · 版本 · UI Tree · 用户路径</text>
      </g>

      <path d="M219 184v30" stroke="#6B8190" stroke-width="3" stroke-linecap="round"/>
      <path d="m209 207 10 11 10-11" fill="none" stroke="#6B8190" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

      <g transform="translate(38 224)">
        <rect width="362" height="92" rx="16" fill="#EAF8F4" stroke="#48B79D" stroke-width="2"/>
        <circle cx="48" cy="46" r="24" fill="#29967C"/>
        <text x="48" y="53" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800">2</text>
        <text x="88" y="39" fill="#173E38" font-size="22" font-weight="800">结构化与多维分析</text>
        <text x="88" y="67" fill="#54736E" font-size="16">标签 · 趋势 · 归因 · P0/P1/P2</text>
      </g>

      <path d="M219 320v30" stroke="#6B8190" stroke-width="3" stroke-linecap="round"/>
      <path d="m209 343 10 11 10-11" fill="none" stroke="#6B8190" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

      <g transform="translate(38 360)">
        <rect width="362" height="92" rx="16" fill="#F2F0FA" stroke="#756FB0" stroke-width="2"/>
        <circle cx="48" cy="46" r="24" fill="#655F9E"/>
        <text x="48" y="53" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800">3</text>
        <text x="88" y="39" fill="#302B55" font-size="22" font-weight="800">报告、矩阵与下一步</text>
        <text x="88" y="67" fill="#6B6785" font-size="16">结论 · 证据 · 路线图 · 重测清单</text>
      </g>
    </g>
  </g>
</svg>
